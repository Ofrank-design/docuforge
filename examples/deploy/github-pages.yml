# Copy to .github/workflows/docs.yml
# Publishes the site to GitHub Pages as a *project* site (https://<user>.github.io/<repo>/).
# In the repo: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The base path must match the repository name. For a user/organisation site
      # (<user>.github.io) use "--base /" instead.
      - run: npx docuforge build --source ./docs --out ./dist --base "/${{ github.event.repository.name }}/" --strict-links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
