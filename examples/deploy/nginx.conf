# Serve the contents of ./dist from /var/www/docs (site built with the default base path "/").
server {
    listen 80;
    server_name docs.example.com;
    root /var/www/docs;
    index index.html;

    # Pages are directories with an index.html: /guides/auth/ -> /guides/auth/index.html
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # DocuForge writes .docuforge-build and .docuforge-manifest.json (harmless metadata); don't serve dotfiles.
    location ~ /\.(?!well-known) { deny all; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
